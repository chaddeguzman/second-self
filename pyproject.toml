[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "second-self"
version = "0.1.0"
description = "Local tooling for the Second Self knowledge system"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "Markdown>=3.10,<4",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=2,<3"]
semantic = ["fastembed>=0.7,<1", "truststore>=0.10,<1"]

[project.scripts]
second-self = "second_self.cli:main"

[tool.setuptools]
package-dir = {"" = "90-system/app"}

[tool.setuptools.packages.find]
where = ["90-system/app"]
include = ["second_self*"]

[tool.setuptools.package-data]
second_self = ["public_scaffold.json", "templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["90-system/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["90-system/app", "90-system/tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["90-system/app/second_self/broker/models.py", "90-system/app/second_self/wiki/models.py"]
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
